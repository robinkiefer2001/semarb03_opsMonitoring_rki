services:
  neo4j:
    image: neo4j:5.23-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-changeme123}
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

  data-collector:
    build:
      context: ../services/data-collector
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATA_COLLECTOR_DOCS_URL: /doc
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-changeme123}
      NEO4J_DATABASE: neo4j
    depends_on:
      - neo4j

  api-service:
    build:
      context: ../services/api-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      API_SERVICE_DOCS_URL: /doc
      DATA_COLLECTOR_BASE_URL: http://data-collector:8001
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-changeme123}
      NEO4J_DATABASE: neo4j
    depends_on:
      - data-collector

  webapp:
    build:
      context: ../services/webapp
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api-service

volumes:
  neo4j_data:
  neo4j_logs:
