services:
  neo4j:
    image: neo4j:5.23-community
    container_name: ops-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-changeme123}
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

  data-collector:
    build:
      context: ../services/data-collector
      dockerfile: Dockerfile
    container_name: ops-data-collector
    environment:
      DATA_COLLECTOR_APP_NAME: Data Collector Service
      DATA_COLLECTOR_DOCS_URL: /doc
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-changeme123}
      NEO4J_DATABASE: neo4j
    ports:
      - "8001:8001"
    depends_on:
      - neo4j

  api-service:
    build:
      context: ../services/api-service
      dockerfile: Dockerfile
    container_name: ops-api-service
    environment:
      API_SERVICE_APP_NAME: Ops API Service
      API_SERVICE_DOCS_URL: /doc
      DATA_COLLECTOR_BASE_URL: http://data-collector:8001
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-changeme123}
      NEO4J_DATABASE: neo4j
    ports:
      - "8002:8002"
    depends_on:
      - data-collector

  webapp:
    build:
      context: ../services/webapp
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: ops-webapp
    ports:
      - "8080:80"
    depends_on:
      - api-service

volumes:
  neo4j_data:
  neo4j_logs:

